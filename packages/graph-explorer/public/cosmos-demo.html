<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cosmos GPU Graph Renderer Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f1a; color: #fff; font-family: system-ui, sans-serif; }
    .header { padding: 20px; text-align: center; }
    .header h1 { font-size: 24px; margin-bottom: 8px; }
    .header p { color: #888; font-size: 14px; }
    .container { display: flex; gap: 4px; height: calc(100vh - 100px); padding: 0 20px 20px; }
    .panel { flex: 1; border-radius: 8px; overflow: hidden; position: relative; }
    .panel-label {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(0,0,0,0.7); padding: 6px 14px; border-radius: 6px;
      font-size: 13px; font-weight: 600; backdrop-filter: blur(4px);
    }
    .panel-label .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; margin-left: 6px; font-weight: 700;
    }
    .cpu { background: #334; border: 1px solid #556; }
    .gpu { background: #1a3a1a; border: 1px solid #2a6a2a; }
    #cy { width: 100%; height: 100%; }
    #cosmos-container { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Graph Renderer Comparison</h1>
    <p>Cytoscape.js (CPU) vs Cosmos (GPU-accelerated WebGL) &mdash; Same data, different renderers</p>
  </div>
  <div class="container">
    <div class="panel" style="background: #1a1a2e;">
      <div class="panel-label">Cytoscape.js <span class="badge cpu">CPU</span></div>
      <div id="cy"></div>
    </div>
    <div class="panel" style="background: #1a1a2e;">
      <div class="panel-label">Cosmos <span class="badge gpu">GPU</span></div>
      <div id="cosmos-container"></div>
    </div>
  </div>

  <!-- Cytoscape -->
  <script src="https://unpkg.com/cytoscape@3.33.1/dist/cytoscape.min.js"></script>
  <!-- Cosmos -->
  <script type="module">
    import { Graph } from 'https://esm.sh/@cosmos.gl/graph@2.6.4';

    // --- Generate sample graph data ---
    const NODE_COUNT = 200;
    const EDGE_COUNT = 350;
    const TYPES = ['Person', 'Company', 'Location', 'Product', 'Event'];
    const COLORS = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6'];

    function randomType() {
      return Math.floor(Math.random() * TYPES.length);
    }

    // Build nodes
    const cyNodes = [];
    const nodeTypes = [];
    for (let i = 0; i < NODE_COUNT; i++) {
      const typeIdx = randomType();
      nodeTypes.push(typeIdx);
      cyNodes.push({
        data: {
          id: `n${i}`,
          label: `${TYPES[typeIdx]} ${i}`,
          type: TYPES[typeIdx],
          color: COLORS[typeIdx],
        }
      });
    }

    // Build edges (random connections)
    const cyEdges = [];
    const edgeSet = new Set();
    for (let i = 0; i < EDGE_COUNT; i++) {
      let s, t;
      do {
        s = Math.floor(Math.random() * NODE_COUNT);
        t = Math.floor(Math.random() * NODE_COUNT);
      } while (s === t || edgeSet.has(`${s}-${t}`));
      edgeSet.add(`${s}-${t}`);
      cyEdges.push({
        data: {
          id: `e${i}`,
          source: `n${s}`,
          target: `n${t}`,
        }
      });
    }

    // --- Render Cytoscape ---
    const cy = cytoscape({
      container: document.getElementById('cy'),
      elements: { nodes: cyNodes, edges: cyEdges },
      style: [
        {
          selector: 'node',
          style: {
            'background-color': 'data(color)',
            'label': '',
            'width': 14,
            'height': 14,
            'border-width': 1,
            'border-color': '#fff',
            'border-opacity': 0.3,
          }
        },
        {
          selector: 'edge',
          style: {
            'width': 0.5,
            'line-color': '#444',
            'target-arrow-color': '#444',
            'target-arrow-shape': 'triangle',
            'arrow-scale': 0.5,
            'curve-style': 'bezier',
            'opacity': 0.5,
          }
        }
      ],
      layout: {
        name: 'fcose' in cytoscape('core', 'fcose') ? 'fcose' : 'cose',
        animate: false,
        randomize: true,
        idealEdgeLength: 80,
        nodeRepulsion: 5000,
      },
      minZoom: 0.1,
      maxZoom: 5,
    });

    // Use cose layout since fcose isn't loaded
    cy.layout({ name: 'cose', animate: false, randomize: true, idealEdgeLength: 80, nodeRepulsion: function() { return 5000; } }).run();

    // --- Render Cosmos ---
    const cosmosContainer = document.getElementById('cosmos-container');

    const positions = new Float32Array(NODE_COUNT * 2);
    for (let i = 0; i < NODE_COUNT; i++) {
      positions[i * 2] = (Math.random() - 0.5) * 600;
      positions[i * 2 + 1] = (Math.random() - 0.5) * 600;
    }

    const colors = new Float32Array(NODE_COUNT * 4);
    const sizes = new Float32Array(NODE_COUNT);
    for (let i = 0; i < NODE_COUNT; i++) {
      const hex = COLORS[nodeTypes[i]];
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      colors[i * 4] = r;
      colors[i * 4 + 1] = g;
      colors[i * 4 + 2] = b;
      colors[i * 4 + 3] = 255;
      sizes[i] = 6;
    }

    const links = new Float32Array(EDGE_COUNT * 2);
    const linkColors = new Float32Array(EDGE_COUNT * 4);
    const linkWidths = new Float32Array(EDGE_COUNT);
    const linkArrows = [];
    for (let i = 0; i < EDGE_COUNT; i++) {
      const src = parseInt(cyEdges[i].data.source.slice(1));
      const tgt = parseInt(cyEdges[i].data.target.slice(1));
      links[i * 2] = src;
      links[i * 2 + 1] = tgt;
      linkColors[i * 4] = 100;
      linkColors[i * 4 + 1] = 100;
      linkColors[i * 4 + 2] = 120;
      linkColors[i * 4 + 3] = 130;
      linkWidths[i] = 0.5;
      linkArrows.push(true);
    }

    const graph = new Graph(cosmosContainer, {
      backgroundColor: '#1a1a2e',
      pointDefaultSize: 6,
      pointSizeScale: 1,
      renderLinks: true,
      curvedLinks: true,
      curvedLinkSegments: 15,
      linkDefaultArrows: true,
      linkArrowsSizeScale: 0.4,
      enableSimulation: true,
      simulationRepulsion: 0.8,
      simulationGravity: 0.2,
      simulationLinkSpring: 0.8,
      simulationLinkDistance: 8,
      simulationFriction: 0.9,
      fitViewOnInit: true,
      enableZoom: true,
      enableDrag: true,
      renderHoveredPointRing: true,
      hoveredPointRingColor: '#ffffff',
      linkOpacity: 0.5,
    });

    graph.setPointPositions(positions);
    graph.setPointColors(colors);
    graph.setPointSizes(sizes);
    graph.setLinks(links);
    graph.setLinkColors(linkColors);
    graph.setLinkWidths(linkWidths);
    graph.setLinkArrows(linkArrows);
    graph.render();
  </script>
</body>
</html>
